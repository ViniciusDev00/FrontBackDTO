<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container py-5">
<h1 class="text-center mb-5">Painel do Médico</h1>

<div class="section">
    <h2>Gerenciar Consultório</h2>
    <form id="consultorio-form" class="row g-3">
        <div class="col-md-6">
            <label for="consultorio" class="form-label">Nome do Consultório</label>
            <input type="text" class="form-control" id="consultorio" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Salvar Consultório</button>
        </div>
    </form>
</div>

<div class="section">
    <h2>Agendar Consulta</h2>
    <form id="consulta-form" class="row g-3">
        <div class="col-md-4">
            <label for="paciente" class="form-label">Paciente</label>
            <input list="lista-pacientes" id="paciente" class="form-control" placeholder="Digite o nome do paciente" required />
            <datalist id="lista-pacientes"></datalist>
        </div>
        <div class="col-md-4">
            <label for="data" class="form-label">Data e Hora</label>
            <input type="datetime-local" class="form-control" id="data" required>
        </div>
        <div class="col-md-4">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" class="form-select">
                <option value="consulta">Consulta</option>
                <option value="retorno">Retorno</option>
            </select>
        </div>
        <div class="col-12">
            <button class="btn btn-success" type="submit">Agendar</button>
        </div>
    </form>
</div>

<div class="section">
    <h2>Meus Pacientes</h2>
    <ul id="pacientes-list" class="list-group"></ul>
</div>

<div class="section">
    <h2>Histórico do Paciente</h2>
    <select id="historico-paciente" class="form-select mb-3"></select>
    <ul id="historico-list" class="list-group"></ul>
</div>

<div class="section">
    <h2>Relatório Financeiro</h2>
    <button id="gerar-relatorio" class="btn btn-dark">Gerar Relatório</button>
    <p class="mt-3" id="resultado-relatorio"></p>
</div>

<script src="script.js"></script>
</body>
</html>
